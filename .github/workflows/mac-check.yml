name: mac-check
# apple silicon check for #2078: bench main vs the fix, and run the litmus tests on the chip
on:
  push:
    branches: [mac-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: machine
        run: uname -sm; sysctl -n machdep.cpu.brand_string hw.ncpu; clang --version | head -1
      - name: litmus on the chip
        continue-on-error: true
        run: |
          cd .mac-check/litmus
          make -j3 GCC=clang >/dev/null
          sh run.sh -s 100000 -r 300 | tee ../litmus.txt
          grep -E "^Observation|^Positive" ../litmus.txt
      - name: main checkout
        run: |
          git worktree add ../main be236f32   # main right before the fix
          (cd bend2/pack && bun install --silent) ; (cd ../main/bend2/pack && bun install --silent)
          git -C ../main log -1 --format='main side: %h %s'; git log -1 --format='fix side: %h %s' HEAD~1
      - name: bench main vs fix
        run: python3 .mac-check/bench.py | tee .mac-check/bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check-${{ matrix.os }}
          path: .mac-check/*.txt
